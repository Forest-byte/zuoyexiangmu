  # JWT 配置（生产环境请务必更换密钥）
  jwt:
    secret: j180-erp-jwt-secret-key-2026-please-change-in-production-0123456789abcdef
    # Token 有效期（小时）
    expire-hours: 8

logging:
  level:
    com.j180.erp: info
